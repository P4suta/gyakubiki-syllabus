name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: >-
            cargo-binstall@1.15.9 cargo-llvm-cov@0.8.7
            cargo-nextest@0.9.140
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov nextest --locked --workspace --exclude syllabus-wasm --no-report
      - run: cargo llvm-cov report --fail-under-lines 80
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked -q -p syllabus-cli -- gen-field-docs --check
      - run: cargo run --locked -q -p syllabus-cli -- gen-palette --check

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: wasm-pack@0.13.1
      - run: wasm-pack build crates/wasm --target web --out-dir ../../web/src/wasm --out-name syllabus
      - run: wasm-pack test --node crates/wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-glue
          path: web/src/wasm

  web:
    name: Web
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-glue
          path: web/src/wasm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test:cov

  e2e:
    name: E2E
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-glue
          path: web/src/wasm
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run playwright:install --with-deps chromium firefox webkit
        working-directory: web
      - run: bun run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  security:
    name: Audit, licenses, SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: >-
            cargo-binstall@1.15.9 cargo-audit@0.22.2
            cargo-deny@0.20.2 cargo-cyclonedx@0.5.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: cargo audit --deny warnings
      - run: cargo deny check
      - run: cargo cyclonedx --format json --all
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun audit
        working-directory: web
      - run: bun run sbom
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: '**/*.cdx.json'
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4 (Node 24)
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4 (Node 24)
        with:
          category: '/language:${{ matrix.language }}'

  pre-release-fuzz:
    name: Pre-release fuzz (${{ matrix.target }})
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_jikanwari, fuzz_parse_sansho_html]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Seed corpus
        run: |
          mkdir -p crates/cli/fuzz/corpus/fuzz_parse_sansho_html
          cp crates/cli/tests/fixtures/sansho_sample.html \
             crates/cli/fuzz/corpus/fuzz_parse_sansho_html/
      - name: Fuzz for two minutes
        working-directory: crates/cli/fuzz
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu -- -max_total_time=120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: pre-release-fuzz-${{ matrix.target }}
          path: crates/cli/fuzz/artifacts/
          if-no-files-found: ignore

  pre-release-rust-mutation:
    name: Pre-release mutation (Rust)
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: >-
            cargo-binstall@1.15.9 cargo-mutants@27.1.0
            cargo-nextest@0.9.140
      - run: cargo mutants --timeout 60 -j 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pre-release-mutants-rust
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore

  pre-release-web-mutation:
    name: Pre-release mutation (Web)
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pre-release-mutants-web
          path: web/reports/
          retention-days: 14
          if-no-files-found: ignore

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1
        with:
          fail_level: error
          reporter: github-check
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules
            !web/**
            !target/**

  production-artifact:
    name: Production artifact
    needs: [rust, wasm, web, e2e, hygiene, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-glue
          path: web/src/wasm
      - name: Build verified dataset
        run: >-
          cargo run --locked --release -q -p syllabus-cli -- build-dataset
          raw/*.json --details-dir raw-details --output web/public
          --source-commit "${GITHUB_SHA}"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
      - run: bun run test:production-html
        working-directory: web
      - run: bun scripts/check-artifact-budget.ts dist
        working-directory: web
      - run: bun scripts/check-search-performance.ts public
        working-directory: web
      - run: bun run playwright:install --with-deps chromium
        working-directory: web
      - run: bun run test:lighthouse
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Pack artifact for provenance
        if: github.event_name == 'push'
        run: tar -czf pages-artifact.tar.gz -C web/dist .
      - name: Attest production artifact
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pages-artifact.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  required:
    name: Required gate
    if: always()
    needs:
      [
        rust,
        wasm,
        web,
        e2e,
        dependency-review,
        security,
        codeql,
        pre-release-fuzz,
        pre-release-rust-mutation,
        pre-release-web-mutation,
        hygiene,
        production-artifact,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          REQUIRED_RESULTS: >-
            ${{ needs.rust.result }} ${{ needs.wasm.result }} ${{ needs.web.result }}
            ${{ needs.e2e.result }} ${{ needs.security.result }} ${{ needs.codeql.result }}
            ${{ needs.hygiene.result }} ${{ needs.production-artifact.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          PRE_RELEASE_RESULTS: >-
            ${{ needs.pre-release-fuzz.result }} ${{ needs.pre-release-rust-mutation.result }}
            ${{ needs.pre-release-web-mutation.result }}
          IS_RELEASE_PR: >-
            ${{ github.event_name == 'pull_request' &&
                startsWith(github.head_ref, 'release-please--branches--main') }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for result in $REQUIRED_RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || exit 1
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] || exit 1
          fi
          for result in $PRE_RELEASE_RESULTS; do
            if [[ "$IS_RELEASE_PR" == "true" ]]; then
              [[ "$result" == "success" ]] || exit 1
            else
              [[ "$result" == "skipped" ]] || exit 1
            fi
          done

  deploy:
    name: Deploy verified artifact
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.required.result == 'success' &&
      needs.production-artifact.result == 'success'
    needs: [required, production-artifact]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
