name: Mutation

# Mutation testing checks whether tests detect injected regressions.
# Manual runs are advisory.
# Release-candidate CI requires full Rust and Web mutation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual full campaign; release-candidate CI gates the same assurance.
  cargo-mutants:
    name: cargo-mutants (full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      # cargo-mutants (+ toolchain helpers) from .mise.toml — same version as local.
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: >-
            cargo-binstall@1.15.9 cargo-mutants@27.1.0
            cargo-nextest@0.9.140
      # Scope (core + tested cli logic, minus net/IO) lives in mutants.toml.
      # --timeout guards mutants that spin an infinite loop.
      - name: mutate
        run: cargo mutants --timeout 60 -j 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mutants-full
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  stryker:
    name: Stryker (web lib, full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: stryker-report
          path: web/reports/
          retention-days: 7
          if-no-files-found: ignore
