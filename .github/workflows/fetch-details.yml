name: Fetch syllabus details

# Crawls the KULAS「シラバス参照」detail pages into raw-details/. Runs only here
# (never locally). Daily, but capped per run (--limit) and incremental: each
# course is written as it is fetched and unchanged courses are skipped, so a large
# backlog is spread over many short off-peak sessions. A partial run is committed
# (if: always()) and a later run continues.

on:
  schedule:
    # UTC 20:00 = JST 05:00 (low-traffic early morning), 1h after the grid refresh
    # so this run sees the fresh lastUpdate values.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Max courses to fetch this run (0 = all; e.g. backfill)
        type: string
        default: '300'
      only:
        description: Fetch only these course codes (comma-separated)
        type: string
        default: ''
      sleep-ms:
        description: Base sleep between requests (ms)
        type: string
        default: '3000'

permissions:
  contents: read

concurrency:
  group: fetch-details
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTOMATION_ENABLED: ${{ vars.DATA_AUTOMATION_ENABLED }}
      HAS_APP: ${{ secrets.DATA_BOT_CLIENT_ID != '' && secrets.DATA_BOT_PRIVATE_KEY != '' }}
      HAS_KULAS_TOKEN: ${{ secrets.KULAS_API_TOKEN != '' }}
    steps:
      - name: Report disabled automation
        if: env.AUTOMATION_ENABLED != 'true'
        run: >-
          echo "::notice::Data automation is disabled. Set DATA_AUTOMATION_ENABLED=true
          only after the data GitHub App and KULAS secrets are configured."
      - name: Validate enabled automation
        if: env.AUTOMATION_ENABLED == 'true'
        run: |
          if [[ "$HAS_APP" != "true" ]]; then
            echo "::error::DATA_BOT_CLIENT_ID and DATA_BOT_PRIVATE_KEY are required"
            exit 1
          fi
          if [[ "$HAS_KULAS_TOKEN" != "true" ]]; then
            echo "::error::KULAS_API_TOKEN is required"
            exit 1
          fi
      - name: Mint data bot token
        id: app-token
        if: env.AUTOMATION_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DATA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        if: env.AUTOMATION_ENABLED == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: env.AUTOMATION_ENABLED == 'true'

      - name: Check out update branch
        if: env.AUTOMATION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: data-refresh/details
        run: |
          if git ls-remote --exit-code origin "refs/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH"
            git switch -C "$UPDATE_BRANCH" FETCH_HEAD
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$UPDATE_BRANCH" -f sha="$GITHUB_SHA"
            git switch -c "$UPDATE_BRANCH"
          fi

      - name: Build syllabus-cli
        id: build
        if: env.AUTOMATION_ENABLED == 'true'
        run: cargo build --locked --release -p syllabus-cli

      - name: Fetch details
        id: fetch
        if: env.AUTOMATION_ENABLED == 'true'
        env:
          KULAS_API_TOKEN: ${{ secrets.KULAS_API_TOKEN }}
        run: |
          # --max-secs is a conservative safety valve below the job timeout so the
          # commit step always runs and a later run resumes (if: always()). The
          # daily --limit keeps a normal run to ~15-25 min; most days it fetches ~0
          # (nothing changed) and exits fast.
          limit="${{ inputs.limit || '300' }}"
          args=(fetch-details --out-dir raw-details/ --sleep-ms "${{ inputs.sleep-ms || '3000' }}" --jitter-ms 2000 --max-secs 3000)
          if [[ "$limit" != "0" && -n "$limit" ]]; then
            args+=(--limit "$limit")
          fi
          if [[ -n "${{ inputs.only }}" ]]; then
            args+=(--only "${{ inputs.only }}")
          fi
          ./target/release/syllabus-cli "${args[@]}"

      - name: Upload diagnostics
        # always(): on a failure/abort the CLI writes diagnostics/ with the failed
        # responses — grab it so the run can be root-caused without a re-run.
        if: >-
          always() &&
          env.AUTOMATION_ENABLED == 'true' &&
          steps.app-token.outcome == 'success' &&
          steps.checkout.outcome == 'success' &&
          steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fetch-details-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit progress to update branch
        # Partial crawl output is working-cache state on a dedicated branch. It
        # can only reach main through the normal required PR gate.
        if: >-
          always() &&
          env.AUTOMATION_ENABLED == 'true' &&
          steps.app-token.outcome == 'success' &&
          steps.checkout.outcome == 'success' &&
          steps.build.outcome == 'success'
        id: commit
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REF_NAME: data-refresh/details
        run: |
          ./target/release/syllabus-cli commit --path raw-details \
            --message "chore(raw-details): syllabus detail crawl ($(date -u +%Y-%m-%d))"

      - name: Open or update data pull request
        if: env.AUTOMATION_ENABLED == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: data-refresh/details
        run: |
          if gh pr view "$UPDATE_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$UPDATE_BRANCH" --title "chore(raw-details): refresh syllabus details"
          else
            gh pr create --base main --head "$UPDATE_BRANCH" \
              --title "chore(raw-details): refresh syllabus details" \
              --body "Automated incremental detail crawl. Merge only after the required release gate validates complete detail coverage and the production artifact."
          fi
