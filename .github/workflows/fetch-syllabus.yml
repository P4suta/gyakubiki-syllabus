name: Fetch syllabus grid

# The grid fetch (findPage) is light (~8 pages, no per-request sleep, ~15 min), so
# running it often costs the server almost nothing. Freshness matters most right
# before a term starts (syllabi are published/updated in Mar-Apr and Sep-Oct), so
# the schedule is seasonal: daily in the busy months, weekly otherwise. This keeps
# lastUpdate current, which the daily fetch-details crawl then picks up.

on:
  schedule:
    # 19:00 UTC = 04:00 JST (1h before the detail crawl at JST 05:00).
    - cron: '0 19 * 3,4,9,10 *'            # busy months (Mar/Apr/Sep/Oct): daily
    - cron: '0 19 * 1,2,5,6,7,8,11,12 0'   # quiet months: Sundays only (weekly)
  workflow_dispatch:
    inputs:
      dry-run:
        description: Fetch and report counts only, without committing
        type: boolean
        default: false
      year:
        description: Set kaikoNendo explicitly (empty = auto-compute current year)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fetch-syllabus
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require and mint data bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DATA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Check out update branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: data-refresh/syllabus
        run: |
          if git ls-remote --exit-code origin "refs/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH"
            git switch -C "$UPDATE_BRANCH" FETCH_HEAD
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$UPDATE_BRANCH" -f sha="$GITHUB_SHA"
            git switch -c "$UPDATE_BRANCH"
          fi

      - name: Build syllabus-cli
        run: cargo build --locked --release -p syllabus-cli

      - name: Fetch syllabus
        env:
          # Empty (the norm) extracts entryContext from the HTML; set only to override for testing.
          KULAS_API_TOKEN: ${{ secrets.KULAS_API_TOKEN }}
        run: |
          args=(fetch --out-dir raw/)
          if [[ -n "${{ inputs.year }}" ]]; then
            args+=(--year "${{ inputs.year }}")
          fi
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          ./target/release/syllabus-cli "${args[@]}"

      - name: Commit update branch if changed
        id: commit
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REF_NAME: data-refresh/syllabus
        run: |
          ./target/release/syllabus-cli commit --path raw \
            --message "chore(raw): syllabus grid refresh ($(date -u +%Y-%m-%d))"

      - name: Open or update data pull request
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: data-refresh/syllabus
        run: |
          if gh pr view "$UPDATE_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$UPDATE_BRANCH" --title "chore(raw): refresh syllabus grid"
          else
            gh pr create --base main --head "$UPDATE_BRANCH" \
              --title "chore(raw): refresh syllabus grid" \
              --body "Automated full syllabus-grid refresh. Merge only after the required release gate validates dataset completeness and the production artifact."
          fi
