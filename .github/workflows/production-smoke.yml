name: Production smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

env:
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://p4suta.github.io/gyakubiki-syllabus/' }}

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # workflow_run is privileged: execute only the trusted default-branch smoke code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run playwright:install --with-deps chromium
        working-directory: web
      - name: Verify deployed application
        run: bun run test:production
        working-directory: web
        env:
          VERIFY_ALL_DETAILS: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: production-smoke-results
          path: web/test-results/
          retention-days: 30
          if-no-files-found: ignore