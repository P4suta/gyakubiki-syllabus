name: Fuzz

# Continuous fuzzing of the two parsers that face messy real-world input.
# Weekly/on-demand runs are advisory; CI repeats both as required release-PR
# checks before release-please may merge.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_jikanwari, fuzz_parse_sansho_html]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: seed corpus
        run: |
          mkdir -p crates/cli/fuzz/corpus/fuzz_parse_sansho_html
          cp crates/cli/tests/fixtures/sansho_sample.html \
             crates/cli/fuzz/corpus/fuzz_parse_sansho_html/ || true
      # cargo-fuzz defaults --target to the triple it was built for, and the
      # install-action binary is musl — whose static libc cannot host ASan
      # ("sanitizer is incompatible with statically linked libc"). Pin the real
      # host triple instead.
      - name: fuzz
        working-directory: crates/cli/fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            --target x86_64-unknown-linux-gnu -- -max_total_time=120
      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/cli/fuzz/artifacts/
